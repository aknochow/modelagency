name: Build and publish modelagency

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m modelagency.cli fetch-benchlm
      - run: python -m unittest discover -s tests -v
      - run: python -m modelagency.cli validate
      - run: python -m modelagency.cli build
      - run: python -m modelagency.cli report
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Send weekly Slack update when configured
        if: ${{ github.event_name == 'schedule' && secrets.MODELAGENCY_SLACK_WEBHOOK_URL != '' }}
        env:
          MODELAGENCY_SLACK_WEBHOOK_URL: ${{ secrets.MODELAGENCY_SLACK_WEBHOOK_URL }}
        run: python -m modelagency.cli slack
